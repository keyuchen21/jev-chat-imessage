[project]
name = "jev-chat-imessage"
version = "0.1.0"
description = "Copilot panel for macOS Messages: intent, risk and ranked reply candidates; never sends"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.32.0",
    "laya>=0.3.4",
    "numpy>=2.0",
    "pyobjc-framework-applicationservices>=12.2.2",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "pyobjc-framework-vision>=12.2.2",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]
